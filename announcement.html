<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KML S4 Announcements</title>
<link rel="stylesheet" href="announcement.css">
</head>

<body>

<div class="container">

<h1>KML S4 Announcement Panel</h1>

<input type="text" id="title" placeholder="Announcement Title">

<textarea id="message" placeholder="Write Announcement"></textarea>

<input type="date" id="date">

<input type="file" id="file">

<label>

<input type="checkbox" id="pin">

Pin Announcement

</label>

<button onclick="saveAnnouncement()">Publish</button>

<h2>Published Announcements</h2>

<div id="announcementList"></div>

</div>

<script src="announcement.js"></script>

</body>
</html>
